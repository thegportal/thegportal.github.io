<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>Super Mario 64</title>
    <style>
      body, html{
        margin: 0;
        padding: 0;
        width: 100vw;
        min-height: 100vh;
        background-color: #111;
        font-family: Arial, Helvetica, sans-serif;
        color: white;
        image-rendering: pixelated;
        scrollbar-width: none;
      }
      ::-webkit-scrollbar {
        display: none;
      }
      #container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        width: 100vw;
        height: 100vh;
      }
      #controls {
        margin-left: 1em;
        display: flex;
        align-items: center;
        margin: 0;
        padding: 5px;
        position: absolute;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 0 0 10px 0;
        backdrop-filter: blur(5px);
        font-size: 12px;
      }
      #controller, #dmca {
        padding-left: 4em;
      }
      #closeBtn {
        background: #747474;
        border: none;
        border-radius: 0 0 5px 0;
        color: white;
        cursor: pointer;
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <div id="keyboard">
        <h2 style="margin: 0; margin-top: 10px;">Keyboard Controls</h2>
        <ul style="margin: 0;">
          <li>Movement: WASD</li>
          <li>A: L</li>
          <li>B: ,</li>
          <li>R: Right Shift</li>
          <li>Z: K</li>
          <li>Start: Space</li>
          <li>C-stick: Arrow Keys</li>
        </ul>
      </div>
    </div>
    <button onclick="toggleControls(this);" id="closeBtn">Hide</button>
    <div id="container">
      <canvas class="emscripten" id="canvas"></canvas>
    </div>
    <script type='text/javascript'>
      var Module = {
        preRun: [],
        postRun: [],
        print: (function() {
          return function(text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
            console.log(text);
          };
        })(),
        printErr: function(text) {
          if (arguments.length > 1)
            text = Array.prototype.slice.call(arguments).join(' ');
          console.error(text);
        },
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.width = window.innerWidth; // Todo: how to do this from c++
          canvas.height = window.innerHeight;
          canvas.addEventListener("webglcontextlost", function(e) {
            alert('WebGL context lost. You will need to reload the page.');
            e.preventDefault();
          }, false);
          return canvas;
        })(),
        setStatus: function(text) {
        }
      };
      let cs=0;
      function toggleControls(el) {
        cs=cs?0:1;
        if(cs){document.getElementById('controls').style.display='none';el.textContent='>';el.blur()}
        else{document.getElementById('controls').style.display='block';el.textContent='Hide';el.blur()}
      }
    </script>
    <script async type="text/javascript" src="https://thegportal.github.io/ghrb/g/super-mario-64/sm64.us.f3dex2e.js"></script>
    <script>
    </script>
  </body>
</html>
