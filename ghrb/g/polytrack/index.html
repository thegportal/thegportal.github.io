<!DOCTYPE html>

<html>
	<head>
	  <title>PolyTrack</title>
		<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
		<link rel="manifest" href="https://raw.githubusercontent.com/thegportal/thegportal.github.io/refs/heads/main/ghrb/g/polytrack/manifest.json" />
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
	</head>
	<body>
		<canvas id="screen"></canvas>
		<div id="ui"></div>
		<div id="transition-layer"></div>

		<script type="module" src="https://raw.githubusercontent.com/thegportal/thegportal.github.io/refs/heads/main/ghrb/g/polytrack/main.bundle.js" defer></script>
		<script>
			const scripts = document.querySelectorAll('script, link');
			scripts.forEach((el) => {
				soh = el.hasAttribute('src') ? true : false;
				if (soh) {
					try {
						let response = await fetch(el.getAttribute('src'));
						if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
						const data = await response.text();
						el.setAttribute(('src'), 'data:text/javascript;base64,' + btoa(data));
					} catch (error) {
						console.error('Fetch failed:', error);
					}
				else {
					try {
						let response = await fetch(el.getAttribute('href'));
						if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
						const data = await response.text();
						el.setAttribute(('href'), 'data:text/javascript;base64,' + btoa(data));
					} catch (error) {
						console.error('Fetch failed:', error);
					}
				}
			});
		</script>
	</body>
</html>
