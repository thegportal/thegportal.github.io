<!DOCTYPE html>

<html>
	<head>
	  <title>PolyTrack</title>
		<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
		<link rel="manifest" href="https://raw.githubusercontent.com/thegportal/thegportal.github.io/refs/heads/main/ghrb/g/polytrack/manifest.json" />
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
	</head>
	<body>
		<canvas id="screen"></canvas>
		<div id="ui"></div>
		<div id="transition-layer"></div>

		<script type="module" src="https://raw.githubusercontent.com/thegportal/thegportal.github.io/refs/heads/main/ghrb/g/polytrack/main.bundle.js" defer></script>
		<script>
			const scripts = document.querySelectorAll('script, link');
			scripts.forEach((el) => {
				soh = el.hasAttribute('src') ? true : false;
				fetch(soh ? el.getAttribute('src') : el.getAttribute('href'))
				  .then(response => {
					if (!response.ok) throw new Error('Network response was not ok');
					const data = response.text();
					el.setAttribute((soh ? 'src' : 'href'), ('data:text/javascript;base64,' + btoa(data)));
				  })
				  .then(data => console.log(data))
				  .catch(error => console.error('Error:', error));
			});
		</script>
	</body>
</html>
