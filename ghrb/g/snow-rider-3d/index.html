<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
		<title>Snow Rider 3D</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="https://thegportal.github.io/ghrb/g/snow-rider-3d/themes.css" />
		<script src="https://thegportal.github.io/ghrb/g/snow-rider-3d/UnityProgress.js"></script>
		<script src="https://thegportal.github.io/ghrb/g/snow-rider-3d/UnityLoader.js"></script>
		<script>
			var gameInstance = UnityLoader.instantiate("gameContainer", "https://raw.githubusercontent.com/thegportal/thegportal.github.io/refs/heads/main/ghrb/g/snow-rider-3d/SnowRider3D-gd-1.json", {
				onProgress: UnityProgress,
				Module: {
					onRuntimeInitialized: function () {
						UnityProgress(gameInstance, "complete");
					},
				},
			});
		</script>
	</head>
	<body>
		<div class="webgl-content"><div id="gameContainer" style="width: 100%; height: 100%; margin: auto"></div></div>
		<script>
			setTimeout(() => {
				const request = indexedDB.open("/idbfs", 1);

				request.onsuccess = (event) => {
				  const db = event.target.result;
				  const transaction = db.transaction("FILE_DATA", "readonly");
				  const store = transaction.objectStore("FILE_DATA");
				  console.log('FILE_DATA');
				
				  const getAllRequest = store.getAll();
				
				  getAllRequest.onsuccess = () => {
					window.alert("Data retrieved.");
				  };
				
				  getAllRequest.onerror = () => {
					window.alert("Error fetching data.");
				  };
				};
			}, 7500);
		</script>
    </body>
</html>
