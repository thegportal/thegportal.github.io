<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
		<title>Snow Rider 3D</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="https://thegportal.github.io/ghrb/g/snow-rider-3d/themes.css" />
		<script src="https://thegportal.github.io/ghrb/g/snow-rider-3d/UnityProgress.js"></script>
		<script src="https://thegportal.github.io/ghrb/g/snow-rider-3d/UnityLoader.js"></script>
		<script>
			var gameInstance = UnityLoader.instantiate("gameContainer", "https://raw.githubusercontent.com/thegportal/thegportal.github.io/refs/heads/main/ghrb/g/snow-rider-3d/SnowRider3D-gd-1.json", {
				onProgress: UnityProgress,
				Module: {
					onRuntimeInitialized: function () {
						UnityProgress(gameInstance, "complete");
					},
				},
			});
		</script>
	</head>
	<body>
		<div class="webgl-content"><div id="gameContainer" style="width: 100%; height: 100%; margin: auto"></div></div>
		<div onclick="document.getElementById('data-bar').style.display = 'block';" style="position: absolute; top: 0; left: calc(50vw - 20px); z-index: 9998; width: 40px; height: 7px; background: #444; box-sizing: border-box; border: 2px solid #777; border-radius: 0 0 7px 7px; cursor: pointer; transition: 0.5s;"></div>
		<div id="data-bar" style="position: absolute; top: 0; left: 0; z-index: 9999; width: 100vw; height: 40px; background: #444; box-sizing: border-box; border: 2px solid #777; border-radius: 0 0 10px 10px; padding: 4px; font-family: Helvetica; font-size: 15px; color: white; user-select: none;">
		<label for="file-btn" style="display: flex; justify-content: center; align-items: center; height: 28px; width: 60px; background: #0330fc; border-radius: 5px; cursor: pointer;">Import</label>
		<input type="file" id="file-btn" style="display: none;" />
		<button onclick="pasteDB()" style="position: absolute; top: 4px; left: 70px; height: 28px; width: 60px; background: #9900ff; border: none; border-radius: 5px; font-size: 15px; color: white; cursor: pointer;">Paste</button>
		<button onclick="exportDB(0)" style="position: absolute; top: 4px; left: 136px; height: 28px; width: 60px; background: #11ab00; border: none; border-radius: 5px; font-size: 15px; color: white; cursor: pointer;">Export</button>
		<button onclick="exportDB(1)" style="position: absolute; top: 4px; left: 202px; height: 28px; width: 60px; background: #04b88b; border: none; border-radius: 5px; font-size: 15px; color: white; cursor: pointer;">Copy</button>
		<button onclick="window.alert('-> If you attempt to refresh or close this tab or window, a pop-up will appear. If you press \'Cancel\', this bar will reappear, and you will be able to save your data, even if the bar was closed before.\n-> Games may restart to accommodate the new imported data.\n-> TIP: Do NOT attempt to close or refresh the window when a pop-up, like this, pops up. The pop-up warning will not appear, and you will lose your new data if you do!\n-> Buh-Bye! :D')" style="position: absolute; top: 4px; left: 268px; height: 28px; width: 115px; background: #fcba03; border: none; border-radius: 5px; font-size: 15px; color: white; cursor: pointer;">Important Info</button>
		<button onclick="this.parentElement.style.display = 'none';" style="position: absolute; top: 4px; right: 4px; height: 28px; width: 60px; background: #fc1703; border: none; border-radius: 5px; font-size: 15px; color: white; cursor: pointer;">Close</button>
		</div>
		<script>
		const dBName = '/idbfs';
		
		function openDB() {
		    return new Promise((resolve, reject) => {
		        const request = indexedDB.open(dBName);
		        request.onsuccess = () => {
		            resolve(request.result);
		        };
		        request.onerror = () => {
		            reject(request.error);
		        };
		    });
		}
		
		async function exportDB(c) {
		    const db = await openDB();
		    const output = {
		        database: db.name,
		        version: db.version,
		        stores: {}
		    };
		    const stores = [...db.objectStoreNames];
		    for (const storeName of stores) {
		        const tx = db.transaction(storeName, "readonly");
		        const store = tx.objectStore(storeName);
		        const data = await new Promise((resolve, reject) => {
		            const req = store.getAll();
		            req.onsuccess = () => resolve(req.result);
		            req.onerror = () => reject(req.error);
		        });
		        output.stores[storeName] = data;
		    }
		    if (c == 0) {
		        const blob = new Blob(
		            [JSON.stringify(output, null, 2)],
		            {type: "application/json"}
		        );
		        const a = document.createElement("a");
		        a.href = URL.createObjectURL(blob);
		        a.download = `${dBName}.json`;
		        a.click();
		        URL.revokeObjectURL(a.href);
		        db.close();
		    } else {
		        navigator.clipboard.writetext(JSON.stringify(output, null, 2));
		    }
		}
		
		async function importDB(file) {
		    const text = await file.text();
		    const imported = JSON.parse(text);
		    const db = await openDB(dBName);
		    for (const storeName in imported.stores) {
		        if (!db.objectStoreNames.contains(storeName)) {
		            console.warn(
		                `Store "${storeName}" does not exist`
		            );
		            continue;
		        }
		        const tx = db.transaction(
		            storeName,
		            "readwrite"
		        );
		        const store = tx.objectStore(storeName);
		        await new Promise((resolve,reject)=>{
		            const req = store.clear();
		            req.onsuccess = resolve;
		            req.onerror = reject;
		        });
		        for (const item of imported.stores[storeName]) {
		
		            await new Promise((resolve,reject)=>{
		                const req = store.put(item);
		
		                req.onsuccess = resolve;
		                req.onerror = reject;
		            });
		
		        }
		        await new Promise(resolve=>{
		            tx.oncomplete = resolve;
		        });
		    }
		    db.close();
		    alert("Import complete");
		}
		
		async function pasteDB() {
		    const text = window.prompt('Paste JSON data here.');
		    const imported = JSON.parse(text);
		    const db = await openDB(dBName);
		    for (const storeName in imported.stores) {
		        if (!db.objectStoreNames.contains(storeName)) {
		            console.warn(
		                `Store "${storeName}" does not exist`
		            );
		            continue;
		        }
		        const tx = db.transaction(
		            storeName,
		            "readwrite"
		        );
		        const store = tx.objectStore(storeName);
		        await new Promise((resolve,reject)=>{
		            const req = store.clear();
		            req.onsuccess = resolve;
		            req.onerror = reject;
		        });
		        for (const item of imported.stores[storeName]) {
		
		            await new Promise((resolve,reject)=>{
		                const req = store.put(item);
		
		                req.onsuccess = resolve;
		                req.onerror = reject;
		            });
		
		        }
		        await new Promise(resolve=>{
		            tx.oncomplete = resolve;
		        });
		    }
		    db.close();
		    alert("Import complete");
		}
		
		document.getElementById('file-btn').addEventListener('change', (event) => {
		    const file = event.target.files[0];
		    if (file.type == 'application/json') {
		      importDB(
		          file
		      );
		    } else {
		      window.alert('Invalid file type.');
		    }
		});
		
		window.addEventListener('beforeunload', (event) => {
		  event.preventDefault();
		  event.returnValue = '';
		  document.getElementById('data-bar').style.display = 'block';
		});
		</script>
    </body>
</html>
