<html>
    <head>
        <script>const bUrl1 = 'https://raw.githubusercontent.com/thegportal/thegportal.github.io/refs/heads/main/ghrb/g/slope/'; const bUrl2 = 'https://thegportal.github.io/ghrb/g/slope/'</script>

        <title>Slope</title>
        <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
        <script src="UnityProgress.js" onerror="this.src=`${bUrl1}${this.src}`"></script>
        <script src="UnityLoader.js" onerror="this.src=`${bUrl1}${this.src}`"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
        <script>
            async function getRandomUser() {
              try {
                const response = await fetch(`${bUrl1}slope_new.json`);
                if (!response.ok) {
                  throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const data = await response.json();
                const data2 = JSON.stringify(data);
                data2 = data2.replace('{{bUrl1}}', bUrl1).replace('{{bUrl1}}', bUrl1);
                const myblob = new Blob([data2], { type: 'application/json' });
                const blobUrl = URL.createObjectURL(myblob);
              } catch (error) {
                console.error('Fetch failed:', error);
              }
            }
            
            getRandomUser();
            var unityInstance = window.unityInstance = UnityLoader.instantiate("gameContainer", blobUrl, {onProgress: UnityProgress,Module:{onRuntimeInitialized: function() {UnityProgress(window.unityInstance, "complete")}}});
        </script>
        <style>
            body {
                background: black;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <p style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; z-index: 999;" id="assetl">Getting Assets... (This could take a while!)</p>
        <div class="webgl-content">
            <div id="gameContainer" style="width: 100%; height: 100%; margin: auto;"></div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>
        <script>
            setTimeout(() => {
              document.getElementById('assetl').style.display = 'none';
            }, 2000);
        </script>
  </body>
</html>
