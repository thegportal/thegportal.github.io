<!DOCTYPE html>
<html>
<head>
<script></script>
<title>Load Flash (Ruffle)</title>
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&family=Iosevka+Charon+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@ruffle-rs/ruffle" onerror="this.src='https://unpkg.com/@ruffle-rs/ruffle'"></script>
<style>
html, body {
  background: black;
  background-size: 100vw 100vh;
  background-repeat: no-repeat;
  background-attachment: fixed;
  width: 100vw;
  margin: 0;
  padding: 0;
  user-select: none;
}

h2, button {
  font-family: Exo;
  color: white;
  margin: 0;
  border: none;
  border-radius: 5px;
} button {
  background: rgba(255, 255, 255, 0.4);
  cursor: pointer;
}

#loadContainer {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(50, 50, 255, 0.4);
  border-radius: 15px;
  padding: 15px;
} #flashContainer {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
</style>
</head>
<body>
<div id="loadContainer">
<h2 id="header"></h2>
<button id="loadbtn">Load</button>
</div>
<center>
<div style="width: 100vw; height: 100vh; background: black;">
<div id="flashContainer"></div>
</div>
</center>
<script>
document.getElementById('header').innerText = `Load Flash file: ${srcUrl.substring(srcUrl.lastIndexOf('/') + 1)}`;
document.getElementById('header').setAttribute('title', srcUrl);
document.getElementById('loadbtn').setAttribute('onclick', `loadFlash('${srcUrl}'); this.parentElement.remove();`);
function loadFlash(source) {
  try {
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    player.style.width = "800px";
    player.style.height = "600px";
    document.getElementById('flashContainer').appendChild(player);
    player.load(source);
  } catch (err) {
    window.alert(err);
  }
}
</script>
</body>
</html>
